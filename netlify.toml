# Netlify deploy config — Out Of the Blue · FTC #24260
# Connect the repo at https://app.netlify.com and these settings are auto-applied.
# Remember to add VITE_CONTACT_ENDPOINT and VITE_DONATE_URL under
# Site settings → Environment variables.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Long-cache the fingerprinted asset bundle (filenames change on each build).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client-side routing: serve index.html for any path the build didn't emit,
# so a direct load or refresh of /team, /awards, ... reaches the React router
# instead of Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
