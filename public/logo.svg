<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Out Of the Blue — full wordmark profile picture (vector recreation).
       The fish is the "U" in BLUE. Download/export this as a square PNG for
       use as a social profile picture. Uses Poppins if available, else a bold
       system sans fallback. -->
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB4EE" />
      <stop offset="1" stop-color="#1593D8" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="40" fill="url(#logo-bg)" />

  <!-- Top line -->
  <text x="120" y="86" text-anchor="middle"
        font-family="Poppins, Outfit, Arial, sans-serif" font-weight="800"
        font-size="36" letter-spacing="3" fill="#FFFFFF">OUT OF THE</text>

  <!-- Bottom line: BL [fish] E -->
  <text x="22" y="182"
        font-family="Poppins, Outfit, Arial, sans-serif" font-weight="800"
        font-size="76" fill="#FFFFFF">BL</text>
  <text x="222" y="182" text-anchor="end"
        font-family="Poppins, Outfit, Arial, sans-serif" font-weight="800"
        font-size="76" fill="#FFFFFF">E</text>

  <!-- Fish as the "U" -->
  <g transform="translate(110 116) scale(0.7)">
    <g transform="rotate(-20 50 50)" fill="#FFFFFF">
      <path d="M22 50 Q50 31 80 50 Q50 69 22 50 Z" />
      <path d="M24 50 L8 40 L14 50 L8 60 Z" />
      <path d="M45 36 L54 27 L61 38 Z" />
      <path d="M52 55 L61 64 L47 60 Z" />
      <circle cx="68" cy="46" r="3.4" fill="#1593D8" />
    </g>
  </g>
</svg>
